global:
  scrape_interval: 5s # kono sec por por django te request korbe r data collect korbe
  evaluation_interval: 5s # prometheus ar moddher roles gula koto sec por por check korbe . 

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: 'django'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'web:8000'

